[package]
name = "accident-route-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# 依存の追加・更新とCargo.lockの統合は③（API・外部通信・基盤）が担当する。
# 手順はREADME.mdの「Cargo設定とlockfile」を参照。

[dependencies]
chrono = "0.4"
csv = "1"
encoding_rs = "0.8"
flate2 = "1"
roxmltree = "0.21"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
