openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: 事故履歴を考慮したルート検索 API
  version: 2.0.0
  description: |
    PythonプロトタイプからRust/Axumへの移行契約。集計の正本はbehavior.md。
    現行の事故点配列と高リスク区間配列をFeatureCollectionへ変更するため旧UIとは非互換。
    経路geometryはWGS84 LineStringを維持し、全GeoJSON座標は[lon,lat]（十進度）。
    origin/destと住所候補だけは名前付きlat/lon。標高次元は使用しない。
    period/weather/day_typeの正規入力は日本語またはall。
    period/weatherのコードは互換入力として受理するが、新フロントは送らない。
    2.0で時間帯を5区分（夜19〜23時と深夜0〜3時を分割）にし、曜日区分day_typeと
    条件の自動判定/api/conditionsを追加した。periodの整数3の意味は1.0から変わる。
    リスクは経路から72m以内の事故の深刻度（死者×10+負傷者）を、距離（σ=24mのガウス）と
    天候倍率で重み付けした参考指標であり、事故確率ではない。
    天候は事故を除外せず重み付けに使う。条件の自動緩和は行わない。
    本文の「移行追加」は現行Pythonにない契約を示す。
    2.0の移行追加として選定経路だけにnavigation（全対象区間と累積距離）を同梱する。
    GPSナビA＋B＋模擬走行の照合・通知はブラウザ内で行い、位置の定期送信APIは設けない。
    再検索ボタン時だけ通常のrouteと既存規則のconditionsを使う。steps・自動再検索・位置履歴保存は行わない。
    認証はCloud RunのIAPで制御し、アプリ独自認証・ナビセッション・経路の永続保存APIは設けない。
servers:
  - url: /
    description: 同一オリジン。開発時はViteの/apiプロキシを使用。
tags:
  - name: 経路
  - name: 住所
  - name: 条件
  - name: 稼働情報
  - name: 静的配信
paths:
  /api/route:
    post:
      operationId: searchRoutes
      tags: [経路]
      summary: 最短時間経路と事故考慮経路を比較する
      description: |
        候補1〜6本を返す。最短は所要時間最小で、最短距離ではない。
        直線距離20〜30000m、候補distanceとgeometry長は各80000m以下。
        リクエストはUTF-8 JSON、1〜16384バイト。大きすぎる場合も400。
        Content-Type不正・JSON不正・値不正は外部呼出し前に400。
        unknownキーは無視。hour/period整合と距離等の相関制約はbehavior.mdを参照。
        出発日時は受け取らない。period/day_type/weatherの自動値は/api/conditionsで得る。
        天候は事故を除外せず、一致事故をweather_matchで別集計し、スコアで重く数える。
        全候補で該当事故が0件でも条件を解除しない。その場合safest_idはnull。
        navigationはfastest_idとnullでないsafest_idの候補だけに含め、未選定はnull。
        同一選定IDでは1個を共用する。ナビ用生成でOSRM呼出しを追加せず、1検索最大3呼出し・steps=falseを維持する。
        全体期限内の追加候補のみの個別上流通信の失敗は200のwarningsに残す。
        ただし共有上流ゲートの読取失敗・競合未解消と待ち行列満杯は、追加候補の取得中でも要求全体を503 service_busyにする。
        受付からJSON準備・gzip圧縮完了までの全体期限35秒（転送を除く）を超えたら、段階によらず503 service_busy。
        候補が取得済みでも全体期限後に200を返さない。
        gzipを許可するAccept-Encodingなら応答圧縮必須、Content-Encoding: gzipとVary: Accept-Encodingを返す。
        identity要求は非圧縮。サイズ・スキーマ検査は展開後のJSONに適用する。
        全応答は概ね11〜12MB、負荷基準は非圧縮12000000バイト。圧縮率は保証しない。
        クライアント期限180秒はfetch開始から本文全受信・展開・解析/検査完了まで。ヘッダーで解除しない。
        想定下り1Mbps以上・RTT 300ms以下。非圧縮12MBは転送96秒、サーバ等を含む見積り138秒。
        サーバの転送待ちは送信開始から120秒、Cloud Run要求タイムアウトは180秒以上。
        Cloud Run＋IAP経由の圧縮/ヘッダー/期限は要確認。途中切断は本文不完了として失敗扱い。
        詳細と回線制限下の本文受信完了の受け入れはbehavior.md 7章。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            examples:
              canonical:
                summary: 現行UIと同じ正規入力
                value:
                  origin: {lat: 35.6812, lon: 139.7671}
                  dest: {lat: 35.7138, lon: 139.7773}
                  mode: walk
                  period: 昼
                  day_type: 平日
                  weather: 晴
                  max_detour_min: 10
              byHour:
                summary: 指定した時刻が属する時間帯全体を集計
                value:
                  origin: {lat: 35.6812, lon: 139.7671}
                  dest: {lat: 35.7138, lon: 139.7773}
                  mode: bike
                  hour: 18
                  weather: all
                  max_detour_min: 5
